dataset:
  repo_id: "koch_bi_wipe_water_tissue" # Identifier for the dataset, e.g., "koch_bi_wipe_water"
  fps: 30
  # root: "/home/hrc/Lerobot_system/Dataset/bags/0320_wipewuthTissue" # Moved to output:path below
  task: "Wipe the water with tissue" # Description for the task

output:
  # The dataset will be saved here. The folder name will be the last part of this path.
  # WARNING: This directory will be deleted if it exists!
  path: "/home/hrc/Lerobot_system/Dataset/Converted_dataset/koch_bi_wipe_water_tissue"

rosbag:
  path: "/home/hrc/Lerobot_system/Dataset/bags/0320_wipewuthTissue"
  # Optional: Limit number of messages/seconds to process for testing
  max_messages: -1 

robot:
  type: "koch_bimanual"
  state_dim: 12
  action_dim: 12

# Topic to LeRobot feature mapping
mapping:
  # Camera topics (CompressedImage or Image)
  cameras:
    "/camera/camera_top/color/image_raw/compressed": 
      key: "observation.images.top"
      width: 1280
      height: 720
    "/camera/camera_far/color/image_raw/compressed": 
      key: "observation.images.far"
      width: 1280
      height: 720
    "/camera/camera_first/color/image_raw/compressed": 
      key: "observation.images.first"
      width: 1280
      height: 720

  # Robot State (JointState) -> observation.state
  # Supports multiple topics to be concatenated
  state:
    key: "observation.state"
    topics:
      - name: "/left_follower/joint_states"
        dim: 6
      - name: "/right_follower/joint_states"
        dim: 6

  # Robot Action (JointState) -> action
  action:
    key: "action"
    topics:
      - name: "/left_follower/joint_states_control"
        dim: 6
      - name: "/right_follower/joint_states_control"
        dim: 6
